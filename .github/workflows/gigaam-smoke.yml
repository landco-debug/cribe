name: ASR real-model smoke — GigaAM + Whisper BIN

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/Cribe/ModelInstall.swift'
      - 'Sources/CribeCore/ASR/**'
      - 'Tests/CribeCoreTests/TranscribeCppEngineTests.swift'
      - '.github/workflows/gigaam-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/Cribe/ModelInstall.swift'
      - 'Sources/CribeCore/ASR/**'
      - 'Tests/CribeCoreTests/TranscribeCppEngineTests.swift'
      - '.github/workflows/gigaam-smoke.yml'

concurrency:
  group: asr-real-model-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gigaam:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download pinned GigaAM Q8_0
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$RUNNER_TEMP/gigaam-v3-e2e-rnnt-Q8_0.gguf"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "$MODEL" \
            "https://huggingface.co/handy-computer/gigaam-v3-e2e-rnnt-gguf/resolve/main/gigaam-v3-e2e-rnnt-Q8_0.gguf"
          echo "78d63b47723b7f8d78c6113a6ef983b5a86e2a86f6c273e1f5cb6967b1c4467a  $MODEL" \
            | shasum -a 256 -c -

      - name: Download Russian fixture
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/ru.wav" \
            "https://raw.githubusercontent.com/handy-computer/transcribe.cpp/v0.2.3/samples/ru.wav"

      - name: Run real GigaAM inference
        env:
          TRANSCRIBE_GIGAAM_GGUF: ${{ runner.temp }}/gigaam-v3-e2e-rnnt-Q8_0.gguf
          TRANSCRIBE_GIGAAM_WAV: ${{ runner.temp }}/ru.wav
        run: swift test --filter realGigaAMSmoke


  whisper-bin:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download legacy whisper.cpp tiny Q8_0 BIN
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2             -o "$RUNNER_TEMP/ggml-tiny-q8_0.bin"             "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q8_0.bin"

      - name: Download JFK fixture
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o "$RUNNER_TEMP/jfk.wav"             "https://raw.githubusercontent.com/handy-computer/transcribe.cpp/v0.2.3/samples/jfk.wav"

      - name: Run real Whisper BIN inference
        env:
          TRANSCRIBE_WHISPER_BIN: ${{ runner.temp }}/ggml-tiny-q8_0.bin
          TRANSCRIBE_WHISPER_BIN_WAV: ${{ runner.temp }}/jfk.wav
        run: swift test --filter realWhisperBINSmoke
